<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Moodify Playlist Generator</title>
        <link rel="stylesheet" href="/styles.css" />
    </head>
    <body>
        <main class="app-shell">
            <section class="app-header">
                <div>
                    <p class="eyebrow">Spotify Playlist Generator</p>
                    <h1>Moodify</h1>
                    <p class="intro">
                        Pick a mood and generate a Spotify playlist that matches how you feel
                    </p>
                </div>

                <a class="login-link" href="/login">Connect Spotify</a>
            </section>

            <section class="status-panel">
                <h2>Your Spotify Status</h2>
                <p id="profileStatus">Not connected yet</p>
            </section>

            <section class="mood-panel">
                <h2>Choose a mood</h2>

                <div class="mood-grid">
                    <button type="button" class="mood-button" data-mood="happy">Happy</button>
                    <button type="button" class="mood-button" data-mood="chill">Chill</button>
                    <button type="button" class="mood-button" data-mood="focused">Focused</button>
                    <button type="button" class="mood-button" data-mood="energetic">Energetic</button>
                    <button type="button" class="mood-button" data-mood="sad">Sad</button>
                    <button type="button" class="mood-button" data-mood="romantic">Romantic</button>
                    <button type="button" class="mood-button" data-mood="angry">Angry</button>
                    <button type="button" class="mood-button" data-mood="sleepy">Sleepy</button>
                </div>
            </section>

            <section class="tracks-panel">
                <div class="tracks-header">
                    <div>
                        <h2>Generated Tracks</h2>
                        <p id="trackStatus">Choose a mood to generate tracks.</p>
                    </div>

                    <form id="savePlaylistForm" class="save-form">
                        <input
                        id="playlistName"
                        name="playlistName"
                        type="text"
                        placeholder="Playlist name"
                        value="Moodify Mix"
                        />
                        <button id="savePlaylistButton" type="submit" disabled>Save Playlist</button>
                    </form>
                </div>

                <div id="saveStatus" class="save-status"></div>
                <div id="tracksList" class="tracks-list"></div>
            </section>
        </main>

        <script src="/app.js"></script>
    </body>
</html>
